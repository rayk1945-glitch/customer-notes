<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Notes</title>
<meta name="theme-color" content="#f4f5f7">
<meta name="description" content="East Star Building Supply customer notes">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Customer Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #111827; --muted: #5b6472; --line: #dfe3e8; --line-strong: #c9cfd6;
    --accent: #1f2a37; --accent-hover: #111827; --focus: rgba(51, 65, 85, .28);
    --ok-bg: #e8f5ed; --ok-fg: #14532d; --err-bg: #fdecec; --err-fg: #7f1d1d;
    --radius: 14px; --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 4px 14px rgba(16, 24, 40, .06);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-size: 16px;
         line-height: 1.45; color: var(--text); background: var(--bg); }
  .hidden { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header + segmented tabs */
  header { position: sticky; top: 0; z-index: 10; background: rgba(244, 245, 247, .92);
           -webkit-backdrop-filter: saturate(180%) blur(12px); backdrop-filter: saturate(180%) blur(12px);
           padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .head-in { max-width: 640px; margin: 0 auto; }
  header h1 { margin: 0 0 10px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .seg { display: flex; background: #e6e9ee; border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #374151;
                font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
  .seg button.active, .seg button[aria-pressed="true"], .seg input:checked + span { background: #fff; color: var(--text);
                box-shadow: 0 1px 2px rgba(16, 24, 40, .12); }
  .seg label { flex: 1; margin: 0; position: relative; }
  .seg label input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg label span { display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 9px;
                    font-size: 15px; font-weight: 600; color: #374151; text-transform: capitalize; }
  .seg label input:focus-visible + span { box-shadow: 0 0 0 3px var(--focus); }

  main { padding: 16px 14px 140px; max-width: 640px; margin: 0 auto; }

  /* Cards / sections */
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
  .sec-h { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .sec-h h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  label.f { display: block; font-size: 14px; font-weight: 600; color: #374151; margin: 12px 0 6px; }
  .req { color: #b42318; }

  input, select, textarea { width: 100%; font: inherit; font-size: 16px; color: var(--text); padding: 11px 12px;
         border: 1px solid var(--line-strong); border-radius: 10px; background: #fff; min-height: 44px;
         transition: border-color .15s, box-shadow .15s; }
  textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  select { appearance: none; -webkit-appearance: none; padding-right: 32px;
           background-image: linear-gradient(45deg, transparent 50%, #6b7280 50%), linear-gradient(135deg, #6b7280 50%, transparent 50%);
           background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  input::placeholder, textarea::placeholder { color: #8a93a0; }
  input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible {
         outline: none; border-color: #475569; box-shadow: 0 0 0 3px var(--focus); }

  /* Buttons */
  button { font: inherit; cursor: pointer; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px;
          border: 1px solid var(--line-strong); border-radius: 999px; background: #fff; color: #1f2937;
          font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .pill:active { background: #f1f3f5; }
  .pill:disabled { opacity: .5; cursor: default; }
  .pill.block { width: 100%; }
  .pill.dashed { border-style: dashed; color: #374151; background: transparent; }
  .icon { width: 18px; height: 18px; flex: none; }
  .xbtn { width: 44px; height: 44px; min-height: 44px; padding: 0; border: 0; border-radius: 999px; background: transparent;
          color: #6b7280; display: inline-flex; align-items: center; justify-content: center; }
  .xbtn:active { background: #f1f3f5; }
  .primary { width: 100%; min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #fff;
             font-size: 17px; font-weight: 700; letter-spacing: .01em; }
  .primary:active { background: var(--accent-hover); }
  .primary:disabled { opacity: .65; }

  /* Notes */
  .notebox + .notebox { margin-top: 12px; }
  .nlabel { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin-bottom: 4px;
            font-size: 14px; font-weight: 600; color: #374151; }
  .notebox:first-child textarea { min-height: 150px; }
  .add-row { margin-top: 12px; }

  /* Customer one line */
  /* One line: phone gets the widest column so a full "(415) 555-1234" shows at 16px on a 375-390px phone.
     Below 370px it wraps to two lines (name + phone, then email). */
  .contact { display: grid; grid-template-columns: 29fr 41fr 30fr; gap: 5px; }
  .contact input { min-width: 0; padding: 11px 6px; }
  @media (max-width: 400px) {
    main { padding-left: 10px; padding-right: 10px; }
    .card { padding: 14px 12px; }
  }
  @media (max-width: 369px) {
    .contact { grid-template-columns: 1fr 1fr; }
    .contact input#email { grid-column: 1 / -1; }
  }

  /* Quote items */
  .item { display: grid; grid-template-columns: 1fr auto 44px; grid-template-areas: "cat ph rm" "desc desc desc" "th th th";
          gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: #fafbfc; }
  .item + .item { margin-top: 10px; }
  .item select { grid-area: cat; }
  .item input.desc { grid-area: desc; }
  .item input[type=file] { display: none; }
  .item .ph { grid-area: ph; padding: 0 12px; }
  .item .rm { grid-area: rm; }
  .item .ithumb { grid-area: th; display: flex; align-items: center; gap: 10px; }
  .item .ithumb:empty { display: none; }
  @media (min-width: 600px) {
    .item { grid-template-columns: 140px 1fr auto 44px; grid-template-areas: "cat desc ph rm" "th th th th"; }
  }

  /* Photo thumbs (form) */
  .thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .thumbs:empty { display: none; }
  .tw { position: relative; width: 76px; height: 76px; }
  .tw img, .tw .ph-tile, .ithumb img, .ithumb .ph-tile { width: 76px; height: 76px; object-fit: cover; border-radius: 10px;
        border: 1px solid var(--line); background: #eef0f3; display: flex; align-items: center; justify-content: center;
        color: var(--muted); font-size: 13px; }
  .ithumb img, .ithumb .ph-tile { width: 60px; height: 60px; }
  .tw .xbtn { position: absolute; top: -14px; right: -14px; }
  .tw .xbtn span { width: 24px; height: 24px; border-radius: 999px; background: #1f2937; color: #fff; display: flex;
                   align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
  .filebtn { position: relative; overflow: hidden; }
  .filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; min-height: 0; }

  .hint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }

  /* Edit banner */
  .banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #eef2f7;
            border: 1px solid #d5dde8; border-radius: var(--radius); padding: 8px 8px 8px 14px; margin-bottom: 14px; font-size: 15px; }

  /* Sticky save bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: rgba(244, 245, 247, .94);
         -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .bar-in { max-width: 640px; margin: 0 auto; }
  .msg { display: none; margin-bottom: 8px; padding: 10px 12px; border-radius: 10px; font-size: 15px; }
  .msg.ok { display: block; background: var(--ok-bg); color: var(--ok-fg); }
  .msg.err { display: block; background: var(--err-bg); color: var(--err-fg); }

  /* Recent / Search */
  .search { display: flex; gap: 8px; margin-bottom: 6px; }
  .search input { flex: 1; border-radius: 999px; padding-left: 16px; }
  #listInfo { margin: 2px 4px 8px; font-size: 13px; }
  .note-card { padding: 16px 16px 12px; }
  .nc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .nc-name { font-size: 20px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; word-break: break-word; }
  .nc-meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .status { font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: capitalize; white-space: nowrap; }
  .status.open { background: #fff4d6; color: #7a4b00; }
  .status.bought { background: #dcf3e4; color: #14532d; }
  .status.passed { background: #eceef1; color: #4b5563; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .links a { min-height: 40px; padding: 0 14px; font-size: 15px; font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .addr { margin-top: 8px; color: #374151; font-size: 15px; }
  .nc-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid #eef0f3; }
  .nc-sec h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  ul.items { list-style: none; margin: 0; padding: 0; }
  ul.items li { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
  ul.items li + li { border-top: 1px dashed #eef0f3; }
  ul.items .txt { flex: 1; min-width: 0; font-size: 16px; word-break: break-word; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin-right: 6px;
          vertical-align: 1px; background: #eceef1; color: #374151; }
  .chip.c-cabinets { background: #e7eefc; color: #1e3a8a; }
  .chip.c-tile { background: #e3f4f1; color: #115e55; }
  .chip.c-bathroom { background: #e6f2fb; color: #0b4a6f; }
  .chip.c-vanity { background: #f1e9fb; color: #5b2a86; }
  .chip.c-countertop { background: #fbeee4; color: #7c3a10; }
  .chip.c-flooring { background: #f5efe3; color: #5c4210; }
  .chip.c-doors { background: #fce8ee; color: #87173a; }
  .chip.c-plumbing { background: #e4f1fb; color: #0c4a6e; }
  a.thumb { flex: none; display: inline-flex; }
  a.thumb img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: #eef0f3; }
  a.plink { flex: none; font-size: 14px; font-weight: 600; color: #1f2937; padding: 10px 4px; }
  .notes-txt p { margin: 0 0 8px; font-size: 18px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .gphotos { display: flex; flex-wrap: wrap; gap: 8px; }
  .gphotos a.thumb img { width: 72px; height: 72px; }
  /* Compact list rows (collapsed) */
  #list .note-card { padding: 0; margin-bottom: 8px; overflow: hidden; }
  .row-sum { display: flex; gap: 10px; align-items: center; padding: 10px 6px 10px 14px; min-height: 44px; cursor: pointer; }
  .row-sum:focus-visible, .nc-top:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--focus); border-radius: var(--radius); }
  .rs-main { flex: 1; min-width: 0; }
  .rs-l1 { display: flex; align-items: center; gap: 8px; }
  .rs-name { font-size: 17px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs-l1 .status { font-size: 12px; padding: 2px 8px; }
  .rs-meta, .rs-note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rs-meta { color: var(--muted); font-size: 13px; line-height: 1.35; }
  .rs-note { font-size: 15px; color: #1f2937; line-height: 1.4; margin-top: 1px; }
  .rs-items { display: flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .rs-items .chip { margin: 0; font-size: 11px; padding: 2px 8px; }
  .rs-thumb { flex: none; width: 52px; height: 52px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); background: #eef0f3; }
  .chev { flex: none; width: 44px; height: 44px; min-height: 44px; border: 0; background: transparent; border-radius: 999px;
          color: #6b7280; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
  .chev svg { transition: transform .15s; }
  .note-card.open .chev svg { transform: rotate(180deg); }
  .row-full { display: none; padding: 6px 12px 12px 16px; }
  .note-card.open .row-sum { display: none; }
  .note-card.open .row-full { display: block; }
  .row-full .nc-top { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 6px; cursor: pointer; }
  .row-full .nc-top .nc-name { min-width: 0; }
  .row-full .nc-top .nc-meta { grid-column: 1 / -1; margin-top: 0; }
  .nc-right { display: flex; align-items: center; gap: 4px; flex: none; }
  .nc-right .status { margin-right: 2px; }
  .pill.danger { color: #b42318; border-color: #f0b4ad; padding: 0 12px; }
  .pill.danger:active { background: #fdecec; }
  .note-card.removing { opacity: .4; pointer-events: none; }
  /* Voice notes */
  .vhead { margin-bottom: 12px; }
  .vhead .vlabel { display: block; font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  .vhead .seg button { min-height: 44px; font-size: 15px; padding: 0 4px; }
  .rec-btn { width: 100%; min-height: 56px; border: 0; border-radius: 14px; background: #f1f3f6; color: #1f2937;
             font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .rec-btn:active { background: #e6e9ee; }
  .rec-btn:disabled { opacity: .5; }
  .rec-live { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 6px 6px 16px; border-radius: 14px;
              background: #fdecec; color: #9f1c1c; font-weight: 700; }
  .rec-live .dot { width: 12px; height: 12px; border-radius: 999px; background: #dc2626; animation: pulse 1s infinite; flex: none; }
  .rec-live .time { flex: 1; font-size: 18px; font-variant-numeric: tabular-nums; }
  .rec-live .stop { min-height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #b91c1c; color: #fff; font-size: 16px; font-weight: 700; }
  @keyframes pulse { 50% { opacity: .35; } }
  .vmsg { margin: 8px 0 0; font-size: 14px; color: #7f1d1d; }
  .vmsg:empty { display: none; }
  .clip { border: 1px solid var(--line); border-radius: 12px; background: #fafbfc; padding: 8px 10px 10px; margin-top: 10px; }
  .clip-h { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #374151; }
  .clip-h .ctitle { flex: 1; }
  .clip-h .live { color: #b91c1c; }
  .clip audio { width: 100%; height: 40px; margin: 6px 0; display: block; }
  .clip .play { margin: 6px 0; }
  .clip textarea { min-height: 72px; font-size: 16px; }
  .clip .chint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .clip .chint:empty { display: none; }
  .chip.mic { background: #fde8e8; color: #8a1c1c; }
  ul.voice { list-style: none; margin: 0; padding: 0; }
  ul.voice li { padding: 6px 0; }
  ul.voice li + li { border-top: 1px dashed #eef0f3; }
  ul.voice .vline { display: flex; align-items: center; gap: 10px; }
  ul.voice .vline .pill { min-height: 40px; padding: 0 14px; }
  ul.voice audio.vplay { width: 100%; height: 44px; margin: 6px 0 2px; display: block; }
  ul.voice .vt { margin-top: 4px; font-size: 16px; white-space: pre-wrap; word-wrap: break-word; }
  @media (prefers-reduced-motion: reduce) { .rec-live .dot { animation: none; } }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .pill { flex: 1; padding: 0 10px; }

  .toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1f2937; color: #fff;
           padding: 10px 16px; border-radius: 999px; font-size: 15px; z-index: 20; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Accounts (v8) */
  .head-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 10px; }
  .head-row h1 { margin: 0; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .who-name { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  .who .pill { min-height: 36px; padding: 0 12px; font-size: 14px; }
  #authView { max-width: 440px; margin: 0 auto; padding: 24px 14px 60px; }
  #authView .lead { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
  #authView .seg { margin-bottom: 14px; }
  #authView .primary { margin-top: 18px; }
  .pin { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
  #authMsg { margin-top: 12px; }
  .shared-only header .seg, .shared-only .who { display: none !important; }
  #sharedView .card h1 { font-size: 22px; margin: 0 0 4px; }
  #sharedView h3 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  #sharedView ul, #sharedView ol { margin: 0; padding-left: 20px; }
  #sharedView li { margin: 4px 0; }
  #sharedView .pre { white-space: pre-wrap; margin: 0; }
  #sharedView a { color: var(--accent); }
  .pill.on { background: #e8f5ed; border-color: #b7dfc4; color: var(--ok-fg); }
  #shareEditBox { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
  #shareEditBox .row { display: flex; gap: 8px; }
  #shareEditBox input { flex: 1; }
  #shareEditMsg { margin-top: 10px; }
  .share-edit label[for=enteredBy], .share-edit #enteredBy, .share-edit #enteredByHint { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="head-row">
      <h1>Customer Notes</h1>
      <div id="who" class="who hidden">
        <span id="whoName" class="who-name"></span>
        <button id="signOutBtn" type="button" class="pill">Sign out</button>
      </div>
    </div>
    <div id="tabs" class="seg hidden" role="tablist" aria-label="View">
      <button id="tabNew" class="active" type="button" role="tab" aria-selected="true">New</button>
      <button id="tabRecent" type="button" role="tab" aria-selected="false">Recent</button>
    </div>
  </div>
</header>

<!-- Sign in / Sign up -->
<section id="authView" class="hidden" aria-labelledby="authTitle">
  <div class="card">
    <h2 id="authTitle" class="sr">Sign in</h2>
    <div class="seg" role="tablist" aria-label="Account">
      <button id="authInTab" type="button" role="tab" class="active" aria-selected="true">Sign in</button>
      <button id="authUpTab" type="button" role="tab" aria-selected="false">Create account</button>
    </div>
    <p id="authLead" class="lead">Sign in with your name and PIN. Your notes are private to your account.</p>
    <form id="authForm" novalidate autocomplete="on">
      <label class="f" for="authName">Name</label>
      <input id="authName" name="username" autocomplete="username" autocapitalize="words" maxlength="30" placeholder="e.g. Ray" required>
      <label class="f" for="authPin">PIN (4 to 10 digits)</label>
      <input id="authPin" class="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="current-password" required>
      <div id="pin2Wrap" class="hidden">
        <label class="f" for="authPin2">PIN again</label>
        <input id="authPin2" class="pin" name="pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="new-password">
      </div>
      <button id="authBtn" class="primary" type="submit">Sign in</button>
      <div id="authMsg" class="msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<!-- Read-only shared note (?s=...) -->
<section id="sharedView" class="hidden"><main><div class="card"><div id="sharedBody" aria-live="polite"><p class="hint">Loading...</p></div>
  <div id="shareEditBox" class="hidden">
    <button id="shareEditBtn" type="button" class="pill">Edit</button>
    <form id="shareEditForm" class="hidden" novalidate>
      <label class="f" for="shareEditPin">Edit PIN</label>
      <div class="row">

<script>
// ---- API (Apps Script JSON endpoint; text/plain body avoids a CORS preflight) ----
var API_URL = 'https://script.google.com/macros/s/AKfycbzP-QSWN-_iBFi7OK0pUEQrpXxyMDg2s7uuz_-4lwq34u9iL9f0OQzRVvoLumRjLizz/exec';
var SESSION_KEY = 'esSession';
var PIN_RE = /^\d{4,10}$/;
var NAME_RE = /^[A-Za-z0-9 ]{2,30}$/;
var shareEdit = null;   // {editToken, s} while editing through a share link
var sharedTok = '';     // ?s= token when the page was opened from a share link
var session = (function () {
  try { var s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s && s.token ? s : null; } catch (e) { return null; }
})();

function api(action, data) {
  var body = {};
  for (var k in (data || {})) body[k] = data[k];
  body.action = action;
  if (session && session.token) body.token = session.token;
  return fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  }).then(function (resp) {
    return resp.text().then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('The server sent an unexpected reply (HTTP ' + resp.status + '). Try again in a minute.'); }
      if (!j.ok) {
        var err = new Error(j.error || 'Something went wrong.');
        if (j.editExpired) { err.editExpired = true; onShareEditExpired(err.message); }
        else if (j.auth && !shareEdit && !sharedTok) { err.auth = true; onAuthExpired(); }
        throw err;
      }
      return j.data;
    });
  }, function () {
    throw new Error('No connection to the server. Check your internet and try again.');
  });
}

var MAX_PHOTOS = 5;
var MAX_SIDE = 1280;
var JPEG_QUALITY = 0.75;
var MAX_NOTES = 20;
var MAX_ITEMS = 50;
var MAX_CLIPS = 40;
var MAX_REC_SECONDS = 300;      // auto-stop at 5:00
var MAX_AUDIO_BYTES = 8 * 1024 * 1024;
var NO_SR_HINT = 'No auto transcript on this phone, type or use the keyboard mic';
// Speech-recognition language: English, Mandarin (Simplified output), Cantonese (falls back to zh-HK if rejected).
var VOICE_LANGS = { 'en-US': { tag: 'en', label: 'English' }, 'zh-CN': { tag: 'zh', label: '\u666e\u901a\u8bdd' }, 'yue-Hant-HK': { tag: 'yue', label: '\u5ee3\u6771\u8a71' } };
var LANG_BY_TAG = { en: 'en-US', zh: 'zh-CN', yue: 'yue-Hant-HK' };
var voiceLang = (function () {
  var v = localStorage.getItem('esVoiceLang');
  if (v === 'zh-TW') v = 'zh-CN'; // earlier 2-way toggle
  return VOICE_LANGS[v] ? v : 'en-US';
})();
var clips = [];       // [{blob, mime, localUrl, url, duration, transcript, hint, recording, el}]
var recState = null;  // active recording
var CATEGORIES = ['Cabinets', 'Tile', 'Bathroom', 'Vanity', 'Countertop', 'Flooring', 'Doors', 'Plumbing', 'Other'];
var photoData = [];   // general photos: [{data, url}] - data = preview src ('' if none), url = Drive link once uploaded
var store = localStorage.getItem('esStore') || '';
var editId = null;    // ID (sheet column M) of the entry being edited
var listRows = [];
var ICON_CHEV = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ICON_TRASH = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var ICON_X = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var ICON_CAM = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>';

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function showMsg(text, ok) {
  var m = $('msg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
}
function clearMsg() { $('msg').className = 'msg'; }

var toastTimer;
function toast(text) {
  var t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
}

// Drive file id -> thumbnail URL ('' if not parseable)
function driveId(u) {
  var m = String(u || '').match(/\/d\/([\w-]{6,})/) || String(u || '').match(/[?&]id=([\w-]{6,})/);
  return m ? m[1] : '';
}
function thumbUrl(u) {
  var id = driveId(u);
  return id ? 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w200' : '';
}

// ---- Tabs ----
function showTab(which) {
  var isNew = which === 'new';
  $('viewNew').classList.toggle('hidden', !isNew);
  $('viewRecent').classList.toggle('hidden', isNew);
  $('tabNew').classList.toggle('active', isNew);
  $('tabRecent').classList.toggle('active', !isNew);
  $('tabNew').setAttribute('aria-selected', String(isNew));
  $('tabRecent').setAttribute('aria-selected', String(!isNew));
  if (!isNew && !$('q').value.trim()) loadRecent();
  window.scrollTo(0, 0);
}
$('tabNew').addEventListener('click', function () { showTab('new'); });
$('tabRecent').addEventListener('click', function () { showTab('recent'); });

// ---- Store (remembered) ----
function renderStore() {
  var btns = document.querySelectorAll('.storeBtn');
  for (var i = 0; i < btns.length; i++) {
    var on = btns[i].getAttribute('data-store') === store;
    btns[i].classList.toggle('active', on);
    btns[i].setAttribute('aria-pressed', String(on));
  }
}
document.querySelectorAll('.storeBtn').forEach(function (b) {
  b.addEventListener('click', function () {
    store = b.getAttribute('data-store');
    if (!editId) localStorage.setItem('esStore', store);
    renderStore();
  });
});
renderStore();

// ---- Status ----
function getStatus() {
  var r = document.querySelector('input[name=status]:checked');
  return r ? r.value : 'open';
}
function setStatus(v) {
  var r = document.querySelector('input[name=status][value="' + (['open', 'bought', 'passed'].indexOf(v) === -1 ? 'open' : v) + '"]');
  r.checked = true;
}

// ---- Entered by (defaults to the signed-in name; still editable) ----
function defaultEnteredBy() { return session ? session.name : ''; }
$('enteredBy').value = defaultEnteredBy();

// ---- Notes (1..20 boxes) ----
function addNoteBox(text) {
  var box = $('notes');
  if (box.children.length >= MAX_NOTES) return null;
  var wrap = document.createElement('div');
  wrap.className = 'notebox';
  var id = 'note' + Date.now() + Math.floor(Math.random() * 1000);
  wrap.innerHTML = '<div class="nlabel"><label for="' + id + '" class="ntitle"></label>' +
    (box.children.length ? '<button type="button" class="xbtn nrm" aria-label="Remove note">' + ICON_X + '</button>' : '') +
    '</div><textarea id="' + id + '" class="note" maxlength="5000" placeholder="What did the customer say / want?"></textarea>';
  if (text) wrap.querySelector('textarea').value = text;
  box.appendChild(wrap);
  updateNotesUi();
  return wrap;
}
function updateNotesUi() {
  var boxes = $('notes').children;
  for (var i = 0; i < boxes.length; i++) boxes[i].querySelector('.ntitle').textContent = 'Note ' + (i + 1);
  var full = boxes.length >= MAX_NOTES;
  $('addNote').disabled = full;
  $('addNote').querySelector('span').textContent = full ? 'Max ' + MAX_NOTES + ' notes' : 'Add note';
  $('noteCount').textContent = boxes.length > 1 ? boxes.length + ' / ' + MAX_NOTES : '';
}
function resetNotes() { $('notes').innerHTML = ''; addNoteBox(); }
function getNotes() {
  var t = $('notes').querySelectorAll('textarea.note'), out = [];
  for (var i = 0; i < t.length; i++) if (t[i].value.trim()) out.push(t[i].value);
  return out;
}
$('addNote').addEventListener('click', function () {
  var w = addNoteBox();
  if (w) w.querySelector('textarea').focus();
});
$('notes').addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('.nrm');
  if (!b) return;
  var w = b.closest('.notebox');
  if (w.querySelector('textarea').value.trim() && !confirm('Remove this note?')) return;
  w.parentNode.removeChild(w);
  updateNotesUi();
});
resetNotes();

// "1. a\n2. b" -> ['a','b'] ; plain text -> [text]
function splitNotes(text) {
  text = String(text || '');
  if (!text.trim()) return [];
  if (/^1\. /.test(text) && /\n2\. /.test(text)) {
    return text.split(/\n(?=\d{1,2}\. )/).map(function (n) { return n.replace(/^\d{1,2}\. /, ''); });
  }
  return [text];
}

// ---- Photos: downscale to max 1280px JPEG before upload ----
function downscale(file) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var w = img.naturalWidth, h = img.naturalHeight;
      var scale = Math.min(1, MAX_SIDE / Math.max(w, h));
      var canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL('image/jpeg', JPEG_QUALITY));
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      reject(new Error('Could not read ' + file.name));
    };
    img.src = url;
  });
}

function previewHtml(p, alt) {
  return p.data ? '<img src="' + esc(p.data) + '" alt="' + esc(alt) + '">' : '<span class="ph-tile">photo</span>';
}

$('photos').addEventListener('change', function (e) {
  var files = Array.prototype.slice.call(e.target.files || []);
  var room = MAX_PHOTOS - photoData.length;
  if (files.length > room) {
    showMsg('Only ' + MAX_PHOTOS + ' photos per note. Extra photos were skipped.', false);
    files = files.slice(0, Math.max(room, 0));
  }
  Promise.all(files.map(downscale)).then(function (urls) {
    photoData = photoData.concat(urls.map(function (d) { return { data: d, url: '' }; }));
    renderThumbs();
  }).catch(function (err) {
    showMsg(err.message, false);
  });
  e.target.value = '';
});

function renderThumbs() {
  $('thumbs').innerHTML = photoData.map(function (p, i) {
    return '<div class="tw">' + previewHtml(p, 'Photo ' + (i + 1)) +
      '<button type="button" class="xbtn" data-i="' + i + '" aria-label="Remove photo ' + (i + 1) + '"><span>&times;</span></button></div>';
  }).join('');
  $('photoCount').textContent = photoData.length ? photoData.length + ' / ' + MAX_PHOTOS : '';
  var full = photoData.length >= MAX_PHOTOS;
  $('photos').disabled = full;
  $('photoBtn').style.opacity = full ? '.5' : '';
}
$('thumbs').addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('button[data-i]');
  if (!b) return;
  photoData.splice(Number(b.getAttribute('data-i')), 1);
  renderThumbs();
});
renderThumbs();

// ---- Quote items (1..50 rows: Category + Description + optional photo) ----
function addItemRow(it) {
  var box = $('items');
  if (box.children.length >= MAX_ITEMS) return null;
  var row = document.createElement('div');
  row.className = 'item';
  row._photo = null; // {data, url}
  var opts = '<option value="">Category</option>' + CATEGORIES.map(function (c) {
    return '<option value="' + esc(c) + '">' + esc(c) + '</option>';
  }).join('');
  row.innerHTML = '<select class="cat" aria-label="Category">' + opts + '</select>' +
    '<input class="desc" maxlength="500" placeholder="Style / color / size" aria-label="Item description">' +
    '<button type="button" class="pill ph" aria-label="Take photo or upload">' + ICON_CAM + '<span>Photo / Upload</span></button>' +
    '<input type="file" class="phfile" accept="image/*" tabindex="-1" aria-hidden="true">' +
    '<button type="button" class="xbtn rm" aria-label="Remove item">' + ICON_X + '</button>' +
    '<div class="ithumb"></div>';
  if (it) {
    row.querySelector('.cat').value = it.category || '';
    row.querySelector('.desc').value = it.description || '';
    if (it.photo) row._photo = { data: thumbUrl(it.photo), url: it.photo };
  }
  box.appendChild(row);
  renderItemPhoto(row);
  updateItemsUi();
  return row;
}

function renderItemPhoto(row) {
  row.querySelector('.ph span').textContent = row._photo ? 'Change' : 'Photo / Upload';
  row.querySelector('.ithumb').innerHTML = row._photo ? previewHtml(row._photo, 'Item photo') +
    '<button type="button" class="pill phrm">Remove photo</button>' : '';
}

function updateItemsUi() {
  var n = $('items').children.length;
  $('addItem').disabled = n >= MAX_ITEMS;
  $('addItem').querySelector('span').textContent = n >= MAX_ITEMS ? 'Max ' + MAX_ITEMS + ' items' : 'Add item';
  $('itemCount').textContent = n + ' / ' + MAX_ITEMS;
}

function resetItems() {
  $('items').innerHTML = '';
  addItemRow();
}

// Item rows that have a description or a photo (others are skipped).
function filledItemRows() {
  var rows = $('items').querySelectorAll('.item'), out = [];
  for (var i = 0; i < rows.length; i++) {
    if (rows[i].querySelector('.desc').value.trim() || rows[i]._photo) out.push(rows[i]);
  }
  return out;
}

$('addItem').addEventListener('click', function () {
  var row = addItemRow();
  if (row) row.querySelector('.cat').focus();
});
$('items').addEventListener('click', function (e) {
  var t = e.target.closest && e.target.closest('button');
  var row = t && t.closest('.item');
  if (!row) return;
  if (t.classList.contains('ph')) { row.querySelector('.phfile').click(); return; }
  if (t.classList.contains('phrm')) { row._photo = null; renderItemPhoto(row); return; }
  if (t.classList.contains('rm')) {
    row.parentNode.removeChild(row);
    if (!$('items').children.length) addItemRow(); else updateItemsUi();
  }
});
$('items').addEventListener('change', function (e) {
  if (!e.target.classList || !e.target.classList.contains('phfile')) return;
  var row = e.target.closest('.item'), file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  downscale(file).then(function (d) {
    row._photo = { data: d, url: '' };
    renderItemPhoto(row);
  }).catch(function (err) { showMsg(err.message, false); });
});
resetItems();

// ---- Voice notes (1..40 clips: audio + live transcript) ----
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  return Math.floor(sec / 60) + ':' + ('0' + (sec % 60)).slice(-2);
}
function setVoiceMsg(t) { $('voiceMsg').textContent = t || ''; }

function renderLang() {
  document.querySelectorAll('.langBtn').forEach(function (b) {
    var on = b.getAttribute('data-lang') === voiceLang;
    b.classList.toggle('active', on);
    b.setAttribute('aria-pressed', String(on));
  });
}
document.querySelectorAll('.langBtn').forEach(function (b) {
  b.addEventListener('click', function () {
    voiceLang = b.getAttribute('data-lang');
    localStorage.setItem('esVoiceLang', voiceLang);
    renderLang();
  });
});
renderLang();

function pickAudioMime() {
  if (!window.MediaRecorder || typeof MediaRecorder.isTypeSupported !== 'function') return '';
  var c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/mp4;codecs=mp4a.40.2', 'audio/ogg;codecs=opus', 'audio/ogg'];
  for (var i = 0; i < c.length; i++) if (MediaRecorder.isTypeSupported(c[i])) return c[i];
  return '';
}

function clipTitle(c, i) {
  var l = c.lang && LANG_BY_TAG[c.lang] ? ' \u00b7 ' + VOICE_LANGS[LANG_BY_TAG[c.lang]].label : '';
  return 'Voice ' + (i + 1) + ' \u00b7 ' + fmtDur(c.duration) + l;
}

function clipHtml(c, i) {
  var player = '';
  if (c.recording) player = '<div class="chint live">Recording\u2026</div>';
  else if (c.localUrl) player = '<audio controls preload="metadata" src="' + esc(c.localUrl) + '"></audio>';
  else if (c.url) player = '<a class="pill play" href="' + esc(c.url) + '" target="_blank" rel="noopener">\u25B6 Play</a>';
  return '<div class="clip-h"><span class="ctitle">' + clipTitle(c, i) + '</span>' +
    (c.recording ? '' : '<button type="button" class="xbtn crm" data-i="' + i + '" aria-label="Remove voice note ' + (i + 1) + '">' + ICON_X + '</button>') +
    '</div>' + player +
    '<textarea class="ctext" data-i="' + i + '" maxlength="5000" aria-label="Transcript for voice note ' + (i + 1) + '" placeholder="Transcript">' + esc(c.transcript || '') + '</textarea>' +
    '<div class="chint">' + esc(c.hint || '') + '</div>';
}

function renderClips() {
  var box = $('clips');
  box.innerHTML = '';
  clips.forEach(function (c, i) {
    var d = document.createElement('div');
    d.className = 'clip';
    d.innerHTML = clipHtml(c, i);
    c.el = d;
    box.appendChild(d);
  });
  updateVoiceUi();
}
function updateVoiceUi() {
  $('clipCount').textContent = clips.length ? clips.length + ' / ' + MAX_CLIPS : '';
  var full = clips.length >= MAX_CLIPS;
  $('recBtn').disabled = full || !!recState;
  $('recBtn').lastElementChild.textContent = full ? 'Max ' + MAX_CLIPS + ' voice notes' : 'Record';
  $('recBtn').classList.toggle('hidden', !!recState);
  $('recLive').classList.toggle('hidden', !recState);
}
function updateClipText(c) {
  if (!c.el) return;
  var t = c.el.querySelector('.ctext');
  if (t && document.activeElement !== t) t.value = c.transcript || '';
  var h = c.el.querySelector('.chint:last-child');
  if (h) h.textContent = c.hint || '';
}

$('clips').addEventListener('input', function (e) {
  if (!e.target.classList.contains('ctext')) return;
  var c = clips[Number(e.target.getAttribute('data-i'))];
  if (c) { c.transcript = e.target.value; if (c.recState) c.recState.edited = true; }
});
$('clips').addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('.crm');
  if (!b) return;
  var i = Number(b.getAttribute('data-i')), c = clips[i];
  if (!c || c.recording) return;
  if ((c.transcript || '').trim() && !confirm('Remove voice note ' + (i + 1) + '?')) return;
  if (c.localUrl) URL.revokeObjectURL(c.localUrl);
  clips.splice(i, 1);
  renderClips();
});

function startSpeech(st) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var c = st.clip;
  if (!SR) { c.hint = NO_SR_HINT; updateClipText(c); return; }
  var finalText = '';
  function begin() {
    var rec;
    try {
      rec = new SR();
      rec.lang = st.lang;
      rec.continuous = true;
      rec.interimResults = true;
    } catch (err) { st.srFailed = true; c.hint = NO_SR_HINT; updateClipText(c); return; }
    rec.onresult = function (ev) {
      var interim = '';
      for (var i = ev.resultIndex; i < ev.results.length; i++) {
        var r = ev.results[i];
        if (r.isFinal) finalText += r[0].transcript.trim() + ' ';
        else interim += r[0].transcript;
      }
      if (!st.edited) {
        c.transcript = (finalText + interim).trim();
        c.hint = '';
        updateClipText(c);
      }
    };
    rec.onerror = function (ev) {
      var err = ev && ev.error;
      if (err === 'no-speech' || err === 'aborted') return; // onend restarts while recording continues
      if (err === 'language-not-supported' && st.lang === 'yue-Hant-HK') { st.lang = 'zh-HK'; return; } // onend retries in zh-HK
      st.srFailed = true;
      if (!(c.transcript || '').trim()) { c.hint = NO_SR_HINT; updateClipText(c); }
    };
    rec.onend = function () {
      if (st.active && !st.srFailed) {
        try { begin(); } catch (err) { st.srFailed = true; }
      }
    };
    st.sr = rec;
    try { rec.start(); } catch (err) {
      if (st.lang === 'yue-Hant-HK') { st.lang = 'zh-HK'; try { begin(); return; } catch (e2) {} }
      st.srFailed = true; c.hint = NO_SR_HINT; updateClipText(c);
    }
  }
  begin();
}

function startRecording() {
  if (recState || clips.length >= MAX_CLIPS) return;
  setVoiceMsg('');
  if (!window.MediaRecorder || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setVoiceMsg('Voice recording is not supported in this browser. Update the phone\u2019s browser (Chrome on Android, Safari on iPhone) or type the note instead.');
    return;
  }
  $('recBtn').disabled = true;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    var mime = pickAudioMime();
    var mr;
    try { mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch (err) { mr = new MediaRecorder(stream); mime = ''; }
    var c = { blob: null, mime: '', localUrl: '', url: '', duration: 0, transcript: '', hint: '', recording: true,
              lang: VOICE_LANGS[voiceLang].tag };
    var st = { clip: c, stream: stream, mr: mr, chunks: [], start: Date.now(), active: true, lang: voiceLang, mime: mime };
    c.recState = st;
    recState = st;
    clips.push(c);
    renderClips();
    mr.ondataavailable = function (ev) { if (ev.data && ev.data.size) st.chunks.push(ev.data); };
    mr.onstop = function () { finishRecording(st); };
    mr.start(1000);
    st.timer = setInterval(function () {
      var sec = (Date.now() - st.start) / 1000;
      c.duration = sec;
      $('recTime').textContent = 'Recording ' + fmtDur(sec) + ' / ' + fmtDur(MAX_REC_SECONDS);
      var t = c.el && c.el.querySelector('.ctitle');
      if (t) t.textContent = clipTitle(c, clips.indexOf(c));
      if (sec >= MAX_REC_SECONDS) stopRecording();
    }, 250);
    $('recTime').textContent = 'Recording 0:00 / ' + fmtDur(MAX_REC_SECONDS);
    startSpeech(st);
  }).catch(function (err) {
    recState = null;
    updateVoiceUi();
    var name = err && err.name;
    setVoiceMsg(name === 'NotAllowedError' || name === 'SecurityError'
      ? 'Microphone permission was blocked. Allow the microphone for this site in the browser settings, then tap Record again.'
      : 'Could not start the microphone' + (err && err.message ? ': ' + err.message : '') + '.');
  });
}

function stopRecording() {
  var st = recState;
  if (!st || !st.active) return;
  st.active = false;
  clearInterval(st.timer);
  st.clip.duration = (Date.now() - st.start) / 1000;
  try { if (st.sr) st.sr.stop(); } catch (err) {}
  try { if (st.mr.state !== 'inactive') st.mr.stop(); else finishRecording(st); } catch (err) { finishRecording(st); }
}

function finishRecording(st) {
  if (st.done) return;
  st.done = true;
  st.stream.getTracks().forEach(function (t) { t.stop(); });
  var c = st.clip;
  var type = (st.mr && st.mr.mimeType) || st.mime || (st.chunks[0] && st.chunks[0].type) || 'audio/webm';
  c.blob = new Blob(st.chunks, { type: type });
  c.mime = type;
  c.recording = false;
  delete c.recState;
  if (!c.blob.size) {
    clips.splice(clips.indexOf(c), 1);
    setVoiceMsg('Nothing was recorded. Check the microphone and try again.');
  } else {
    c.localUrl = URL.createObjectURL(c.blob);
    if (c.blob.size > MAX_AUDIO_BYTES) setVoiceMsg('Voice ' + (clips.indexOf(c) + 1) + ' is larger than 8 MB and will not upload. Remove it and record shorter clips.');
    if (!(c.transcript || '').trim() && (st.srFailed || !(window.SpeechRecognition || window.webkitSpeechRecognition))) c.hint = NO_SR_HINT;
  }
  recState = null;
  renderClips();
  // Late final results can still arrive briefly after stop; keep them if the text wasn't edited.
  setTimeout(function () { if (c.el) updateClipText(c); }, 800);
}

$('recBtn').addEventListener('click', startRecording);
$('stopBtn').addEventListener('click', stopRecording);

function resetClips() {
  if (recState) { recState.active = false; clearInterval(recState.timer); try { recState.mr.stop(); } catch (e) {} try { recState.stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} recState = null; }
  clips.forEach(function (c) { if (c.localUrl) URL.revokeObjectURL(c.localUrl); });
  clips = [];
  setVoiceMsg('');
  renderClips();
}
renderClips();

function blobToDataUrl(blob) {
  return new Promise(function (resolve, reject) {
    var fr = new FileReader();
    fr.onload = function () { resolve(fr.result); };
    fr.onerror = function () { reject(new Error('Could not read a voice clip.')); };
    fr.readAsDataURL(blob);
  });
}

// ---- Edit / Clone: fill the form from a saved entry ----
// edit  = same entry, saved back in place by ID.
// clone = reuse the quote for a different customer: items (with photos), notes and store are copied,
//         customer fields are cleared, status open, and Save creates a new row with a new ID.
function fillForm(r, mode) {
  if (mode === 'edit' && !r.id) { toast('This entry has no ID yet. Reload Recent and try again.'); return; }
  resetForm(true);
  store = r.store || store;
  renderStore();
  var items = (r.items || []).filter(function (it) { return it && (it.text || it.photo); });
  if (items.length) {
    $('items').innerHTML = '';
    items.forEach(function (it) {
      addItemRow({ category: it.category || '', description: it.description != null ? it.description : it.text, photo: it.photo });
    });
  }
  var notes = splitNotes(r.note);
  if (notes.length) {
    $('notes').innerHTML = '';
    notes.forEach(function (n) { addNoteBox(n); });
  }
  if (mode === 'edit') {
    editId = r.id;
    $('name').value = r.name || '';
    $('phone').value = r.phone || '';
    $('email').value = r.email || '';
    $('address').value = r.address || '';
    setStatus(r.status);
    $('enteredBy').value = r.enteredBy || '';
    photoData = (r.photos || []).filter(Boolean).map(function (u) { return { data: thumbUrl(u), url: u }; });
    renderThumbs();
    clips = (r.voice || []).filter(function (v) { return v && v.url; }).map(function (v) {
      return { url: v.url, duration: v.seconds || 0, transcript: v.transcript || '', lang: v.lang || '', localUrl: '', blob: null, hint: '' };
    });
    renderClips();
    $('editText').textContent = 'Editing ' + (r.name || 'entry') + ' \u00b7 ' + (r.timestamp || '');
    $('saveBtn').textContent = 'Update note';
  } else {
    $('editText').textContent = 'Cloned from ' + (r.name || 'entry') + ' \u2013 enter the new customer';
  }
  $('editBanner').classList.remove('hidden');
  clearMsg();
  showTab('new');
  if (mode === 'clone') { $('name').focus(); $('name').scrollIntoView({ block: 'center' }); }
  toast(mode === 'edit' ? 'Editing saved note' : 'Quote copied \u2013 enter the new customer');
}

// Saved Drive photo that can't preview (no access) -> grey 'photo' tile in the form.
$('noteForm').addEventListener('error', function (e) {
  var img = e.target;
  if (img.tagName !== 'IMG') return;
  var tile = document.createElement('span');
  tile.className = 'ph-tile';
  tile.textContent = 'photo';
  img.parentNode.replaceChild(tile, img);
}, true);

$('cancelEdit').addEventListener('click', function () {
  if (shareEdit) { if (confirm('Discard your changes?')) finishShareEdit(null); return; }
  resetForm(); clearMsg();
});

// ---- Save / Update ----
function resetForm(keepMsg) {
  editId = null;
  ['name', 'phone', 'email', 'address'].forEach(function (id) { $(id).value = ''; });
  setStatus('open');
  store = localStorage.getItem('esStore') || '';
  renderStore();
  $('enteredBy').value = defaultEnteredBy();
  resetNotes();
  resetItems();
  photoData = [];
  renderThumbs();
  resetClips();
  $('editBanner').classList.add('hidden');
  $('saveBtn').textContent = 'Save note';
}

// Old google.script.run names -> JSON API actions.
function runServer(fn, args) {
  if (shareEdit) {   // editing through a share link: uploads + save go through the edit session
    switch (fn) {
      case 'uploadPhoto': return api('uploadPhoto', { editToken: shareEdit.editToken, data: args[0], mimeType: args[1], nameHint: args[2] });
      case 'uploadAudio': return api('uploadAudio', { editToken: shareEdit.editToken, data: args[0], mimeType: args[1], nameHint: args[2] });
      case 'updateNote': return api('shareUpdate', { editToken: shareEdit.editToken, note: args[1] });
    }
    return Promise.reject(new Error('Not available while editing a shared note.'));
  }
  switch (fn) {
    case 'uploadPhoto': return api('uploadPhoto', { data: args[0], mimeType: args[1], nameHint: args[2] });
    case 'uploadAudio': return api('uploadAudio', { data: args[0], mimeType: args[1], nameHint: args[2] });
    case 'saveNote': return api('save', { note: args[0] });
    case 'updateNote': return api('update', { id: args[0], note: args[1] });
    case 'deleteNote': return api('delete', { id: args[0] });
    case 'recentNotes': return api('recent', { n: args[0] });
    case 'searchNotes': return api('search', { q: args[0] });
  }
  return Promise.reject(new Error('Unknown call ' + fn));
}

// Upload photos and voice clips one at a time (keeps each call small). Already-uploaded ones are reused on retry.
// list items: photo {data, url} or clip {blob, mime, url} (clips have .blob).
function uploadAll(list, nameHint, onProgress) {
  var pending = list.filter(function (p) { return !p.url; });
  var i = 0;
  function next() {
    if (i >= pending.length) return Promise.resolve();
    var p = pending[i];
    onProgress(i + 1, pending.length);
    var call = p.blob
      ? blobToDataUrl(p.blob).then(function (d) { return runServer('uploadAudio', [d, p.mime || p.blob.type, nameHint + ' voice']); })
      : runServer('uploadPhoto', [p.data, 'image/jpeg', nameHint]);
    return call.then(function (url) {
      p.url = url;
      i++;
      return next();
    });
  }
  return next();
}

var saving = false;
$('noteForm').addEventListener('submit', function (e) {
  e.preventDefault();
  if (saving) return;
  var name = $('name').value.trim();
  if (!name) { showMsg('Customer name is required.', false); $('name').focus(); return; }
  if (recState) { showMsg('Stop the voice recording first, then save.', false); return; }
  var tooBig = clips.filter(function (c) { return !c.url && c.blob && c.blob.size > MAX_AUDIO_BYTES; });
  if (tooBig.length) { showMsg('A voice note is larger than 8 MB. Remove it (record shorter clips) and save again.', false); return; }

  var enteredBy = $('enteredBy').value.trim();

  var itemRows = filledItemRows();
  var uploads = photoData.slice();
  itemRows.forEach(function (row) { if (row._photo) uploads.push(row._photo); });
  var photoCount = uploads.length;
  clips.forEach(function (c) { uploads.push(c); });
  var isEdit = !!editId;
  var label = isEdit ? 'Update note' : 'Save note';

  var btn = $('saveBtn');
  saving = true;
  btn.disabled = true;
  btn.textContent = isEdit ? 'Updating...' : 'Saving...';
  clearMsg();

  function fail(err) {
    saving = false;
    btn.disabled = false;
    btn.textContent = label;
    var text = (err && err.message) ? err.message : String(err);
    if (err && err.editExpired) return;
    if (err && err.auth) {
      showMsg('NOT saved yet: please sign in again. Your entry is kept; tap ' + (isEdit ? 'Update' : 'Save') + ' again after signing in.', false);
      return;
    }
    showMsg('NOT saved: ' + text + ' Your entry is still on screen; check your connection and tap ' + (isEdit ? 'Update' : 'Save') + ' again.', false);
  }

  uploadAll(uploads, name, function (n, total) {
    btn.textContent = 'Uploading ' + n + ' of ' + total + '…';
    showMsg('Uploading ' + n + ' of ' + total + '…', true);
  }).then(function () {
    btn.textContent = isEdit ? 'Updating...' : 'Saving...';
    var payload = {
      name: name,
      phone: $('phone').value,
      email: $('email').value,
      address: $('address').value,
      store: store,
      items: itemRows.map(function (row) {
        return {
          category: row.querySelector('.cat').value || 'Other',
          description: row.querySelector('.desc').value,
          photoUrl: row._photo ? row._photo.url : ''
        };
      }),
      status: getStatus(),
      notes: getNotes(),
      photoUrls: photoData.map(function (p) { return p.url; }),
      voiceNotes: clips.map(function (c) {
        return { url: c.url, duration: Math.round(c.duration || 0), transcript: c.transcript || '', lang: c.lang || '' };
      }),
      enteredBy: enteredBy
    };
    return isEdit ? runServer('updateNote', [editId, payload]) : runServer('saveNote', [payload]);
  }).then(function (res) {
    saving = false;
    btn.disabled = false;
    if (shareEdit) { finishShareEdit(res); return; }
    resetForm();
    showMsg((res.updated ? 'Updated: ' : 'Saved: ') + res.name + ' (' + res.timestamp + ')' +
      (res.items ? ', ' + res.items + ' item(s)' : '') +
      (photoCount ? ', ' + photoCount + ' photo(s)' : '') +
      (res.clips ? ', ' + res.clips + ' voice note(s)' : ''), true);
    window.scrollTo(0, 0);
  }).catch(fail);
});

// ---- Recent / Search ----
function catClass(c) { return 'c-' + String(c || 'other').toLowerCase().replace(/[^a-z]/g, ''); }

function audioPlayer(u, i) {
  var id = driveId(u);
  if (!id) return '<a class="pill" href="' + esc(u) + '" target="_blank" rel="noopener">\u25b6 Play</a>';
  var src = 'https://drive.google.com/uc?export=download&id=' + encodeURIComponent(id);
  return '<audio class="vplay" controls preload="none" src="' + esc(src) + '" aria-label="Voice note ' + (i + 1) + '"></audio>';
}

function photoLink(u, alt) {
  var t = thumbUrl(u);
  if (!t) return '<a class="plink" href="' + esc(u) + '" target="_blank" rel="noopener">photo</a>';
  return '<a class="thumb" href="' + esc(u) + '" target="_blank" rel="noopener" aria-label="' + esc(alt) + '">' +
    '<img src="' + esc(t) + '" alt="' + esc(alt) + '" loading="lazy"></a>';
}

function firstPhoto(r) {
  var items = r.items || [];
  for (var i = 0; i < items.length; i++) if (items[i] && items[i].photo && thumbUrl(items[i].photo)) return items[i].photo;
  var ph = (r.photos || []).filter(function (u) { return thumbUrl(u); });
  return ph[0] || '';
}

// Collapsed one-glance row.
function summaryHtml(r, idx, status, items, notes) {
  var cats = [];
  items.forEach(function (it) { if (it.category && cats.indexOf(it.category) === -1) cats.push(it.category); });
  var meta = [r.timestamp, r.store, r.enteredBy ? 'by ' + r.enteredBy : ''].filter(Boolean).map(esc).join(' \u00b7 ');
  var preview = notes.length ? notes[0].replace(/\s+/g, ' ') : '';
  var ph = firstPhoto(r);
  var vcount = (r.voice || []).length;
  return '<div class="row-sum" role="button" tabindex="0" aria-expanded="false" aria-label="' + esc(r.name) + ', show details">' +
    '<div class="rs-main">' +
      '<div class="rs-l1"><span class="rs-name">' + esc(r.name) + '</span><span class="status ' + status + '">' + esc(status) + '</span></div>' +
      '<div class="rs-meta">' + meta + '</div>' +
      '<div class="rs-note">' + (preview ? esc(preview) : '<span class="rs-meta">No note</span>') + '</div>' +
      (items.length || vcount ? '<div class="rs-items">' +
        (items.length ? '<span>' + items.length + ' item' + (items.length === 1 ? '' : 's') + '</span>' +
          cats.slice(0, 2).map(function (c) { return '<span class="chip ' + catClass(c) + '">' + esc(c) + '</span>'; }).join('') +
          (cats.length > 2 ? '<span>+' + (cats.length - 2) + '</span>' : '') : '') +
        (vcount ? '<span class="chip mic" aria-label="' + vcount + ' voice notes">\uD83C\uDF99 ' + vcount + '</span>' : '') + '</div>' : '') +
    '</div>' +
    (ph ? '<img class="rs-thumb" src="' + esc(thumbUrl(ph)) + '" alt="" loading="lazy">' : '') +
    '<span class="chev" aria-hidden="true">' + ICON_CHEV + '</span>' +
  '</div>';
}

function renderList(rows, info) {
  listRows = rows || [];
  $('listInfo').textContent = info;
  $('list').innerHTML = listRows.map(function (r, idx) {
    var items = (r.items || []).filter(function (it) { return it && (it.text || it.photo); });
    var notes = splitNotes(r.note);
    var photos = (r.photos || []).filter(Boolean);
    var voice = r.voice || [];
    var tel = String(r.phone || '').replace(/[^\d+]/g, '');
    var status = ['open', 'bought', 'passed'].indexOf(r.status) === -1 ? 'open' : r.status;
    var meta = [r.timestamp, r.store, r.enteredBy ? 'by ' + r.enteredBy : ''].filter(Boolean).map(esc).join(' \u00b7 ');
    var links = (r.phone ? '<a class="pill" href="tel:' + esc(tel) + '">Call ' + esc(r.phone) + '</a>' : '') +
      (r.email ? '<a class="pill" href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' : '');
    return '<article class="card note-card" data-i="' + idx + '">' +
      summaryHtml(r, idx, status, items, notes) +
      '<div class="row-full">' +
      '<div class="nc-top" tabindex="0" role="button" aria-expanded="true" aria-label="' + esc(r.name) + ', hide details">' +
        '<div class="nc-name">' + esc(r.name) + '</div>' +
        '<div class="nc-right"><span class="status ' + status + '">' + esc(status) + '</span>' +
          (r.id ? '<button type="button" class="pill danger" data-act="delete" data-i="' + idx + '" aria-label="Delete note for ' + esc(r.name) + '">' + ICON_TRASH + '<span>Delete</span></button>' : '') +
          '<span class="chev" aria-hidden="true">' + ICON_CHEV + '</span></div>' +
        '<div class="nc-meta">' + meta + '</div></div>' +
      (links ? '<div class="links">' + links + '</div>' : '') +
      (r.address ? '<div class="addr">' + esc(r.address) + '</div>' : '') +
      (items.length ? '<div class="nc-sec"><h3>Quote items (' + items.length + ')</h3><ul class="items">' +
        items.map(function (it) {
          var chip = it.category ? '<span class="chip ' + catClass(it.category) + '">' + esc(it.category) + '</span>' : '';
          var desc = it.category ? it.description : it.text;
          return '<li><div class="txt">' + chip + esc(desc) + '</div>' +
            (it.photo ? photoLink(it.photo, (it.category || 'Item') + ' photo') : '') + '</li>';
        }).join('') + '</ul></div>' : '') +
      (notes.length ? '<div class="nc-sec notes-txt"><h3>Notes</h3>' +
        notes.map(function (n, i) { return '<p>' + (notes.length > 1 ? (i + 1) + '. ' : '') + esc(n) + '</p>'; }).join('') + '</div>' : '') +
      (voice.length ? '<div class="nc-sec"><h3>Voice notes (' + voice.length + ')</h3><ul class="voice">' +
        voice.map(function (v, i) {
          return '<li><div class="vline">' +
            '<span class="nc-meta">Voice ' + (i + 1) + (v.duration ? ' · ' + esc(v.duration) : '') +
              (v.lang && LANG_BY_TAG[v.lang] ? ' · ' + VOICE_LANGS[LANG_BY_TAG[v.lang]].label : '') + '</span></div>' +
            (v.url ? audioPlayer(v.url, i) : '') +
            (v.transcript ? '<div class="vt">' + esc(v.transcript) + '</div>' : '') + '</li>';
        }).join('') + '</ul></div>' : '') +
      (photos.length ? '<div class="nc-sec"><h3>Photos</h3><div class="gphotos">' +
        photos.map(function (u, i) { return photoLink(u, 'Photo ' + (i + 1)); }).join('') + '</div></div>' : '') +
      '<div class="actions">' +
        '<button type="button" class="pill' + (r.share ? ' on' : '') + '" data-act="share" data-i="' + idx + '">' + (r.share ? 'Share link' : 'Share') + '</button>' +
        (r.share ? '<button type="button" class="pill" data-act="unshare" data-i="' + idx + '">Stop sharing</button>' : '') +
        '<button type="button" class="pill" data-act="edit" data-i="' + idx + '">Edit</button>' +
        '<button type="button" class="pill" data-act="clone" data-i="' + idx + '">Clone</button>' +
      '</div></div></article>';
  }).join('');
}

// Expand one row at a time; tapping the open card's header (or chevron) collapses it.
function toggleCard(card) {
  var open = !card.classList.contains('open');
  var all = $('list').querySelectorAll('.note-card.open');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('open');
  if (open) {
    card.classList.add('open');
    var top = card.getBoundingClientRect().top;
    var headerH = document.querySelector('header').offsetHeight;
    if (top < headerH + 8) window.scrollBy(0, top - headerH - 8);
    var h = card.querySelector('.nc-top');
    if (h && document.activeElement && card.contains(document.activeElement)) h.focus();
  } else {
    var sum = card.querySelector('.row-sum');
    if (sum && document.activeElement && card.contains(document.activeElement)) sum.focus();
  }
}

function deleteCard(r, card, btn) {
  if (!r.id) { alert('This entry has no ID yet. Reload Recent and try again.'); return; }
  if (!confirm('Delete note for ' + r.name + '? You can recover it from the Deleted tab in the sheet.')) return;
  btn.disabled = true;
  card.classList.add('removing');
  runServer('deleteNote', [r.id]).then(function () {
    if (card.parentNode) card.parentNode.removeChild(card);
    if (editId && editId === r.id) resetForm();
    var left = $('list').querySelectorAll('.note-card').length;
    if (!left) $('listInfo').textContent = 'No notes to show.';
    toast('Deleted');
  }).catch(function (err) {
    btn.disabled = false;
    card.classList.remove('removing');
    if (!(err && err.auth)) alert('Could not delete: ' + ((err && err.message) ? err.message : String(err)));
  });
}

// Thumbnail that can't load (no access / not an image) -> plain 'photo' link.
$('list').addEventListener('error', function (e) {
  var img = e.target;
  if (img.tagName !== 'IMG') return;
  if (img.classList.contains('rs-thumb')) { img.parentNode.removeChild(img); return; }
  var a = img.closest('a');
  if (!a) return;
  a.className = 'plink';
  a.textContent = 'photo';
}, true);

function shareText(r) {
  var lines = [r.name];
  if (r.phone) lines.push(r.phone);
  if (r.email) lines.push(r.email);
  if (r.address) lines.push(r.address);
  var items = (r.items || []).filter(function (it) { return it && (it.text || it.photo); });
  if (items.length) {
    lines.push('', 'Quote items:');
    items.forEach(function (it) { lines.push('- ' + it.text + (it.photo ? ' (photo: ' + it.photo + ')' : '')); });
  }
  if (r.note) lines.push('', 'Notes:', r.note);
  if (r.voice && r.voice.length) {
    lines.push('', 'Voice notes:');
    r.voice.forEach(function (v, i) {
      lines.push((i + 1) + '. ' + (v.duration ? '[' + v.duration + (v.lang ? ' ' + v.lang : '') + '] ' : '') + (v.url || '') + (v.transcript ? ' – ' + v.transcript : ''));
    });
  }
  lines.push('', [r.timestamp, r.store, r.status].filter(Boolean).join(' \u00b7 '));
  return lines.join('\n');
}

// ---- Share links (read-only, no PIN) ----
function appUrl() { return location.href.split(/[?#]/)[0]; }
function shareUrl(tok) { return appUrl() + '?s=' + tok; }
function shareSummary(r) {
  var n = (r.items || []).filter(function (it) { return it && (it.text || it.photo); }).length;
  return r.name + ' \u2013 ' + n + ' item' + (n === 1 ? '' : 's');
}
function sendLink(r) {
  var url = shareUrl(r.share);
  var text = shareSummary(r);
  function copy() {
    var both = text + '\n' + url;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(both).then(function () { toast('Link copied'); }, function () { window.prompt('Copy this link:', both); });
    } else {
      window.prompt('Copy this link:', both);
    }
  }
  if (navigator.share) {
    navigator.share({ title: 'Customer: ' + r.name, text: text, url: url }).catch(function (e) {
      if (!e || e.name !== 'AbortError') copy();
    });
  } else {
    copy();
  }
}
function rerenderOpen(r) {
  var idx = listRows.indexOf(r);
  renderList(listRows, $('listInfo').textContent);
  var card = $('list').querySelectorAll('.note-card')[idx];
  if (card) card.classList.add('open');
}
function doShare(r, btn) {
  if (r.share) { sendLink(r); return; }   // already shared: no round trip, so the share sheet opens right away
  if (!r.id) { toast('This entry has no ID yet. Reload Recent and try again.'); return; }
  btn.disabled = true;
  api('share', { id: r.id }).then(function (res) {
    btn.disabled = false;
    r.share = res.share;
    rerenderOpen(r);
    sendLink(r);
  }).catch(function (err) {
    btn.disabled = false;
    if (!err.auth) toast('Could not share: ' + err.message);
  });
}
function stopSharing(r, btn) {
  if (!confirm('Stop sharing this note? The link will stop working.')) return;
  btn.disabled = true;
  api('unshare', { id: r.id }).then(function () {
    r.share = '';
    rerenderOpen(r);
    toast('Sharing stopped');
  }).catch(function (err) {
    btn.disabled = false;
    if (!err.auth) toast('Could not stop sharing: ' + err.message);
  });
}

$('list').addEventListener('click', function (e) {
  if (!e.target.closest) return;
  var b = e.target.closest('button[data-act]');
  if (!b) {
    if (e.target.closest('a')) return; // tel:, mailto:, photo links
    var hit = e.target.closest('.row-sum, .nc-top');
    if (hit) toggleCard(hit.closest('.note-card'));
    return;
  }
  var r = listRows[Number(b.getAttribute('data-i'))];
  if (!r) return;
  var act = b.getAttribute('data-act');
  if (act === 'delete') deleteCard(r, b.closest('.note-card'), b);
  else if (act === 'share') doShare(r, b);
  else if (act === 'unshare') stopSharing(r, b);
  else if (act === 'edit') fillForm(r, 'edit');
  else if (act === 'clone') fillForm(r, 'clone');
});

$('list').addEventListener('keydown', function (e) {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var hit = e.target.closest && e.target.closest('.row-sum, .nc-top');
  if (!hit || e.target !== hit) return;
  e.preventDefault();
  toggleCard(hit.closest('.note-card'));
});

function listError(err) {
  if (err && err.auth) return;
  var text = (err && err.message) ? err.message : String(err);
  renderList([], 'Could not load: ' + text + ' (this app needs internet).');
}

function loadRecent() {
  $('listInfo').textContent = 'Loading...';
  api('recent', { n: 30 }).then(function (rows) {
    renderList(rows, rows.length ? 'Latest ' + rows.length + ' notes' : 'No notes yet.');
  }).catch(listError);
}

function doSearch() {
  var q = $('q').value.trim();
  if (!q) { loadRecent(); return; }
  $('listInfo').textContent = 'Searching...';
  api('search', { q: q }).then(function (rows) {
    renderList(rows, rows.length ? rows.length + ' match(es) for "' + q + '"' +
      (rows.length === 50 ? ' (showing first 50)' : '') : 'No matches for "' + q + '".');
  }).catch(listError);
}
$('searchBtn').addEventListener('click', doSearch);
$('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });

// ---- Accounts: sign in / sign up / sign out ----
var authMode = 'in';
function setAuthMode(m) {
  authMode = m;
  var up = m === 'up';
  $('authInTab').classList.toggle('active', !up); $('authInTab').setAttribute('aria-selected', String(!up));
  $('authUpTab').classList.toggle('active', up); $('authUpTab').setAttribute('aria-selected', String(up));
  $('pin2Wrap').classList.toggle('hidden', !up);
  $('authPin').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
  $('authBtn').textContent = up ? 'Create account' : 'Sign in';
  $('authTitle').textContent = up ? 'Create account' : 'Sign in';
  $('authLead').textContent = up
    ? 'Pick a name (2 to 30 letters, numbers or spaces) and a 4 to 10 digit PIN. Your notes are private to your account.'
    : 'Sign in with your name and PIN. Your notes are private to your account.';
  authMsg('', true);
}
function authMsg(text, ok) {
  var m = $('authMsg');
  m.textContent = text;
  m.className = text ? 'msg ' + (ok ? 'ok' : 'err') : 'msg';
}
$('authInTab').addEventListener('click', function () { setAuthMode('in'); });
$('authUpTab').addEventListener('click', function () { setAuthMode('up'); });
['authPin', 'authPin2'].forEach(function (id) {
  $(id).addEventListener('input', function () { var v = this.value.replace(/\D/g, '').slice(0, 10); if (v !== this.value) this.value = v; });
});

function showApp() {
  document.body.classList.remove('shared-only');
  $('authView').classList.add('hidden');
  $('sharedView').classList.add('hidden');
  $('appMain').classList.remove('hidden');
  $('tabs').classList.remove('hidden');
  $('who').classList.remove('hidden');
  $('whoName').textContent = session.name;
}
function showAuth(msg) {
  $('appMain').classList.add('hidden');
  $('tabs').classList.add('hidden');
  $('who').classList.add('hidden');
  $('authView').classList.remove('hidden');
  if (msg) authMsg(msg, false);
}
// Token expired / revoked: back to sign-in; the form (and any uploads already done) stays in memory.
function onAuthExpired() {
  var keepName = session ? session.name : '';
  session = null;
  localStorage.removeItem(SESSION_KEY);
  setAuthMode('in');
  if (keepName && !$('authName').value) $('authName').value = keepName;
  $('authPin').value = '';
  showAuth('Your session has expired. Please sign in again. Anything you typed is kept.');
  window.scrollTo(0, 0);
}

$('authForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var name = $('authName').value.replace(/\s+/g, ' ').trim();
  var pin = $('authPin').value;
  if (!NAME_RE.test(name)) { authMsg('Name must be 2 to 30 characters: letters, numbers and spaces only.', false); $('authName').focus(); return; }
  if (!PIN_RE.test(pin)) { authMsg('PIN must be 4 to 10 digits.', false); $('authPin').focus(); return; }
  var payload = { name: name, pin: pin };
  if (authMode === 'up') {
    if ($('authPin2').value !== pin) { authMsg('The two PINs do not match.', false); $('authPin2').focus(); return; }
    payload.pin2 = $('authPin2').value;
  }
  var btn = $('authBtn');
  var label = btn.textContent;
  btn.disabled = true;
  btn.textContent = authMode === 'up' ? 'Creating...' : 'Signing in...';
  authMsg('', true);
  session = null;
  api(authMode === 'up' ? 'signup' : 'signin', payload).then(function (res) {
    btn.disabled = false;
    btn.textContent = label;
    var prev = $('whoName').textContent;
    session = { token: res.token, name: res.name, expires: res.expires };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    $('authPin').value = ''; $('authPin2').value = '';
    var e = $('enteredBy');
    if (!e.value.trim() || e.value.trim() === prev) e.value = session.name;
    showApp();
    if (res.legacyAssigned) toast(res.legacyAssigned + ' older note(s) moved into your account');
    if (!$('viewRecent').classList.contains('hidden')) loadRecent();
  }).catch(function (err) {
    btn.disabled = false;
    btn.textContent = label;
    authMsg(err.message, false);
  });
});

$('signOutBtn').addEventListener('click', function () {
  if (saving) { toast('Wait for the save to finish.'); return; }
  if (!confirm('Sign out of Customer Notes on this device?')) return;
  var s = session;
  session = null;
  localStorage.removeItem(SESSION_KEY);
  if (s) {
    var body = { action: 'signout', token: s.token };
    fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).catch(function () {});
  }
  resetForm();
  clearMsg();
  renderList([], '');
  $('authName').value = '';
  setAuthMode('in');
  showAuth('');
  toast('Signed out');
});

// ---- Read-only shared note (?s=<token>) ----
function renderShared(n) {
  var h = [];
  h.push('<h1>' + esc(n.name) + '</h1>');
  h.push('<p class="hint" style="margin-top:0">' + esc([n.date, n.store, n.status].filter(Boolean).join(' \u00b7 ')) + '</p>');
  var c = [];
  if (n.phone) c.push('<a href="tel:' + esc(String(n.phone).replace(/[^\d+]/g, '')) + '">' + esc(n.phone) + '</a>');
  if (n.email) c.push('<a href="mailto:' + esc(n.email) + '">' + esc(n.email) + '</a>');
  if (n.address) c.push(esc(n.address));
  if (c.length) h.push('<p style="margin:8px 0 0">' + c.join('<br>') + '</p>');
  function a(u, label) { return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(label) + '</a>'; }
  if (n.items && n.items.length) {
    h.push('<h3>Quote items</h3><ul>' + n.items.map(function (it) { return '<li>' + esc(it.text) + (it.photo ? ' \u00b7 ' + a(it.photo, 'photo') : '') + '</li>'; }).join('') + '</ul>');
  }
  if (n.note) h.push('<h3>Notes</h3><p class="pre">' + esc(n.note) + '</p>');
  if (n.voice && n.voice.length) {
    h.push('<h3>Voice notes</h3><ol>' + n.voice.map(function (v) {
      var lang = v.lang && LANG_BY_TAG[v.lang] ? ' \u00b7 ' + VOICE_LANGS[LANG_BY_TAG[v.lang]].label : '';
      return '<li>' + (v.url ? a(v.url, '\u25B6 Play') + ' ' : '') + '<span class="hint">' + esc(v.duration) + lang + '</span>' +
        (v.transcript ? '<br>' + esc(v.transcript) : '') + '</li>';
    }).join('') + '</ol>');
  }
  if (n.photos && n.photos.length) {
    h.push('<h3>Photos</h3><div class="gphotos">' + n.photos.map(function (u, i) { return photoLink(u, 'Photo ' + (i + 1)); }).join('') + '</div>');
  }
  h.push('<p class="hint" style="margin-top:18px">Read-only shared note \u00b7 <a href="' + esc(appUrl()) + '">Open Customer Notes</a></p>');
  return h.join('');
}
function showShared(tok) {
  sharedTok = tok;
  document.body.classList.add('shared-only');
  $('appMain').classList.add('hidden');
  $('shareEditBox').classList.add('hidden');
  document.title = 'Shared note';
  $('sharedView').classList.remove('hidden');
  api('shared', { s: tok }).then(function (n) {
    document.title = 'Customer: ' + n.name;
    $('sharedBody').innerHTML = renderShared(n);
    $('shareEditBox').classList.remove('hidden');
  }).catch(function (err) {
    $('sharedBody').innerHTML = '<h1>Link not available</h1><p class="hint">' + esc(err.message) + '</p>' +
      '<p class="hint"><a href="' + esc(appUrl()) + '">Open Customer Notes</a></p>';
  });
}

// ---- Editing through a share link (edit PIN -> 2-hour session for this one note) ----
var shareEditPending = false;   // form has unsaved share edits (kept if the edit session runs out)
function shareEditMsg(text, ok) { var m = $('shareEditMsg'); m.textContent = text; m.className = text ? 'msg ' + (ok ? 'ok' : 'err') : 'msg'; }
$('shareEditBtn').addEventListener('click', function () {
  $('shareEditBtn').classList.add('hidden');
  $('shareEditForm').classList.remove('hidden');
  $('shareEditPin').focus();
});
$('shareEditPin').addEventListener('input', function () { var v = this.value.replace(/\D/g, '').slice(0, 10); if (v !== this.value) this.value = v; });
$('shareEditForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var pin = $('shareEditPin').value;
  if (!PIN_RE.test(pin)) { shareEditMsg('Edit PIN must be 4 to 10 digits.', false); return; }
  var b = $('shareUnlockBtn');
  b.disabled = true;
  shareEditMsg('', true);
  api('shareEditPin', { s: sharedTok, pin: pin }).then(function (res) {
    b.disabled = false;
    $('shareEditPin').value = '';
    shareEdit = { editToken: res.editToken, s: sharedTok };
    document.body.classList.add('share-edit');
    $('sharedView').classList.add('hidden');
    $('appMain').classList.remove('hidden');
    if (!shareEditPending) {
      var n = res.note;
      n.id = 'share';
      fillForm(n, 'edit');
      $('editText').textContent = 'Editing shared note: ' + (n.name || '');
      shareEditPending = true;
    } else {
      showMsg('Unlocked again. Tap Update to save your changes.', true);
    }
    window.scrollTo(0, 0);
  }).catch(function (err) {
    b.disabled = false;
    shareEditMsg(err.message, false);
  });
});
function onShareEditExpired(msg) {
  shareEdit = null;
  $('appMain').classList.add('hidden');
  $('sharedView').classList.remove('hidden');
  $('shareEditBox').classList.remove('hidden');
  $('shareEditBtn').classList.add('hidden');
  $('shareEditForm').classList.remove('hidden');
  shareEditMsg((msg || 'Your edit session ended.') + (shareEditPending ? ' Your changes are kept; enter the edit PIN to continue.' : ''), false);
  window.scrollTo(0, 0);
}
function finishShareEdit(res) {
  shareEdit = null;
  shareEditPending = false;
  document.body.classList.remove('share-edit');
  resetForm();
  clearMsg();
  $('shareEditForm').classList.add('hidden');
  $('shareEditBtn').classList.remove('hidden');
  shareEditMsg(res ? 'Saved.' : '', true);
  showShared(sharedTok);
  if (res) toast('Saved');
  window.scrollTo(0, 0);
}

// ---- Boot ----
(function boot() {
  var s = new URLSearchParams(location.search).get('s');
  if (s) { showShared(s); return; }
  if (session) {
    showApp();
    $('enteredBy').value = $('enteredBy').value || session.name;
    api('me', {}).catch(function () {}); // expired token -> sign-in screen (handled in api)
  } else {
    setAuthMode('in');
    showAuth('');
  }
})();
</script>
</body>
